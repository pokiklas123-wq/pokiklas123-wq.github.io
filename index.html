<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر المانجا الشامل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-size: 18px;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background-color: #1e1e1e;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            overflow-y: auto;
        }
        .canvas-container {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }
        canvas {
            background-color: #000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        button, label.btn {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover, label.btn:hover {
            background-color: #3b3b3b;
        }
        .btn-primary { background-color: #1976D2; border-color: #115293; }
        .btn-success { background-color: #388E3C; border-color: #2E7D32; }
        .btn-danger { background-color: #D32F2F; border-color: #C62828; }
        .tools-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .tools-row button {
            flex: 1;
            min-width: 45px;
        }
        input[type="range"], input[type="text"] {
            width: 100%;
            padding: 6px;
            background: #2b2b2b;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        .color-palette {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin: 5px 0;
        }
        .color-box {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .info-panel {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: auto;
            padding: 5px;
            background: #111;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>محرر فريمات المانجا (نسخة الويب المتكاملة)</header>

    <div class="main-container">
        <!-- لوحة التحكم الجانبية -->
        <div class="sidebar">
            <div class="tools-row">
                <label class="btn btn-primary" for="bgInput">📁 اختر خلفية</label>
                <input type="file" id="bgInput" accept="image/*" style="display: none;">
                
                <label class="btn btn-primary" for="imgInput">🖼️ إضافة صورة</label>
                <input type="file" id="imgInput" accept="image/*" style="display: none;">
            </div>

            <button class="btn-success" onclick="openTextDialog()">📝 إضافة نص</button>
            <button id="drawToggleBtn" onclick="toggleDrawingMode()">✏️ تفعيل الرسم الحر</button>

            <hr style="border-color: #333;">

            <div>
                <label>حجم القلم / الفرشاة: <span id="penSizeVal">10</span></label>
                <input type="range" id="penSizeRange" min="2" max="50" value="10" oninput="penSize = this.value; document.getElementById('penSizeVal').innerText = penSize;">
            </div>

            <div class="color-palette" id="colorPalette">
                <!-- ألوان الرسم -->
                <div class="color-box" style="background: red;" onclick="selectedColor='red'"></div>
                <div class="color-box" style="background: blue;" onclick="selectedColor='blue'"></div>
                <div class="color-box" style="background: green;" onclick="selectedColor='green'"></div>
                <div class="color-box" style="background: yellow;" onclick="selectedColor='yellow'"></div>
                <div class="color-box" style="background: white;" onclick="selectedColor='white'"></div>
                <div class="color-box" style="background: black;" onclick="selectedColor='black'"></div>
            </div>

            <hr style="border-color: #333;">

            <div class="tools-row">
                <button onclick="undo()" class="btn">↩️ تراجع</button>
                <button onclick="deleteSelected()" class="btn btn-danger">🗑️ حذف المحدد</button>
            </div>

            <button class="btn btn-primary" onclick="exportImage()">💾 تصدير الصورة النهائية</button>

            <div class="info-panel" id="infoText">👆 اضغط على أي عنصر لتحريكه وتحديده</div>
        </div>

        <!-- منطقة العمل ورسم الفريم -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="mangaCanvas" width="800" height="1200"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mangaCanvas');
        const ctx = canvas.getContext('2d');

        let bgImage = null;
        let layers = [];
        let selectedLayer = null;
        let isDrawing = false;
        let drawingMode = false;
        let selectedColor = 'red';
        let penSize = 10;
        let drawingPaths = [];

        let startX, startY;

        // تحميل الخلفية
        document.getElementById('bgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        bgImage = img;
                        redraw();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // إضافة صورة كطبقة
        document.getElementById('imgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        let layer = {
                            type: 'image',
                            img: img,
                            x: canvas.width / 2 - 100,
                            y: canvas.height / 2 - 150,
                            width: 200,
                            height: 300,
                            scale: 1
                        };
                        layers.push(layer);
                        selectedLayer = layer;
                        redraw();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // إضافة نص
        function openTextDialog() {
            let txt = prompt("أدخل النص المطلوب:");
            if (txt) {
                let layer = {
                    type: 'text',
                    text: txt,
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    color: 'white',
                    size: 30,
                    font: 'Arial'
                };
                layers.push(layer);
                selectedLayer = layer;
                redraw();
            }
        }

        // تبديل وضع الرسم
        function toggleDrawingMode() {
            drawingMode = !drawingMode;
            let btn = document.getElementById('drawToggleBtn');
            if (drawingMode) {
                btn.style.background = '#388E3C';
                btn.innerText = "✏️ وضع الرسم مُفعّل";
                selectedLayer = null;
            } else {
                btn.style.background = '#2b2b2b';
                btn.innerText = "✏️ تفعيل الرسم الحر";
            }
            redraw();
        }

        // إدارة الفأرة واللمس على الكانفاس
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (drawingMode) {
                isDrawing = true;
                startX = x;
                startY = y;
                drawingPaths.push({type: 'begin', x, y, color: selectedColor, size: penSize});
                return;
            }

            // البحث عن الطبقات المحددة (من الأعلى للأدنى)
            selectedLayer = null;
            for (let i = layers.length - 1; i >= 0; i--) {
                let l = layers[i];
                if (l.type === 'image') {
                    if (x >= l.x && x <= l.x + l.width && y >= l.y && y <= l.y + l.height) {
                        selectedLayer = l;
                        break;
                    }
                } else if (l.type === 'text') {
                    ctx.font = `${l.size}px ${l.font}`;
                    let metrics = ctx.measureText(l.text);
                    if (x >= l.x - metrics.width/2 && x <= l.x + metrics.width/2 && y >= l.y - l.size && y <= l.y) {
                        selectedLayer = l;
                        break;
                    }
                }
            }
            startX = x;
            startY = y;
            redraw();
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (drawingMode && isDrawing) {
                drawingPaths.push({type: 'draw', x, y, color: selectedColor, size: penSize});
                redraw();
                return;
            }

            if (selectedLayer && e.buttons === 1) {
                let dx = x - startX;
                let dy = y - startY;
                selectedLayer.x += dx;
                selectedLayer.y += dy;
                startX = x;
                startY = y;
                redraw();
            }
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        // إعادة رسم الكانفاس بالكامل
        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. رسم الخلفية
            if (bgImage) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. رسم الصور والطبقات
            layers.forEach(l => {
                if (l.type === 'image') {
                    ctx.drawImage(l.img, l.x, l.y, l.width, l.height);
                    if (l === selectedLayer) {
                        ctx.strokeStyle = '#00E676';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(l.x, l.y, l.width, l.height);
                    }
                } else if (l.type === 'text') {
                    ctx.fillStyle = l.color;
                    ctx.font = `${l.size}px Tahoma`;
                    ctx.textAlign = 'center';
                    ctx.fillText(l.text, l.x, l.y);
                    if (l === selectedLayer) {
                        let m = ctx.measureText(l.text);
                        ctx.strokeStyle = '#00E676';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(l.x - m.width/2 - 5, l.y - l.size - 5, m.width + 10, l.size + 10);
                    }
                }
            });

            // 3. رسم الخطوط الحرة
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (let i = 0; i < drawingPaths.length; i++) {
                let p = drawingPaths[i];
                if (p.type === 'begin') {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = p.size;
                } else if (p.type === 'draw') {
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                }
            }
        }

        // حذف العنصر المحدد
        function deleteSelected() {
            if (selectedLayer) {
                layers = layers.filter(l => l !== selectedLayer);
                selectedLayer = null;
                redraw();
            }
        }

        // تراجع عن آخر رسمة
        function undo() {
            // إزالة آخر مسار رسم
            let lastBeginIndex = drawingPaths.map(p => p.type).lastIndexOf('begin');
            if (lastBeginIndex !== -1) {
                drawingPaths.splice(lastBeginIndex);
                redraw();
            }
        }

        // تصدير الصورة النهائية
        function exportImage() {
            let link = document.createElement('a');
            link.download = 'manga_edit.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
